
<div class="flex center"
     *ngFor="let service of myServices; let index = index" 
     class="image-texte flex"
     [ngClass]="{ 'row-reverse': index % 2 === 0 }"
>
 
  <img src="{{ service.img }}" alt="{{ service.description }}">
  <div>
    <h2>{{ service.title }}</h2>
    <p>
      {{ service.description }}
    </p>
  </div>
</div>
<app-ourvalues></app-ourvalues>
